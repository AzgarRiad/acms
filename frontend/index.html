<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commerce Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🛒 Commerce Manager</h1>
  <div class="tabs">
    <button class="tab active" id="tabCatalogBtn" onclick="showTab('catalog')">Catalog</button>
    <button class="tab" id="tabOrdersBtn" onclick="showTab('orders')">Orders</button>
    <button class="tab" style="background:transparent;" onclick="resetData()">↺ Reset data</button>
  </div>
</header>
<main>

<div class="stat">
  <div class="box"><div class="n" id="statProducts">0</div><div class="l">Products</div></div>
  <div class="box"><div class="n" id="statStock">0</div><div class="l">Units in stock</div></div>
  <div class="box"><div class="n" id="statOrders">0</div><div class="l">Orders</div></div>
  <div class="box"><div class="n" id="statRevenue">৳0</div><div class="l">Revenue (paid)</div></div>
</div>

<!-- CATALOG TAB -->
<div id="tabCatalog">
  <div class="card">
    <h2>Add product</h2>
    <div class="row">
      <input id="pName" placeholder="Name">
      <input id="pPrice" type="number" step="0.01" placeholder="Price" class="qty" style="width:90px">
      <input id="pStock" type="number" placeholder="Stock" class="qty" style="width:80px">
      <button onclick="addProduct()">Add</button>
    </div>
  </div>
  <div class="card">
    <h2>Product catalog</h2>
    <div class="tablewrap">
      <table id="productTable">
        <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th colspan="2"></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="productEmpty" class="empty hidden">No products yet — add one above.</div>
  </div>
</div>

<!-- ORDERS TAB -->
<div id="tabOrders" class="hidden">
  <div class="card">
    <h2>New order</h2>
    <div id="orderItems"></div>
    <div class="row" style="margin-bottom:10px;">
      <button class="secondary" onclick="addOrderLine()">+ Add item</button>
    </div>
    <input id="customerName" placeholder="Customer name (optional)" style="margin-bottom:10px;">
    <input id="customerPhone" placeholder="Phone number (optional)" style="margin-bottom:10px;">
    <button onclick="createOrder()">Create order</button>
  </div>
  <div class="card">
    <h2>Order overview</h2>
    <div class="tablewrap">
      <table id="orderTable">
        <thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="orderEmpty" class="empty hidden">No orders yet.</div>
  </div>
</div>

</main>
<script src="script.js"></script>
</body>
</html>
